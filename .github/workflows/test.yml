name: PowerShell regression tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and run decision/session tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & .\tests\PowerProfileDetection.Tests.ps1
          & .\tests\PowerProfileUI.Tests.ps1
          & .\tests\PowerProfileSettings.Tests.ps1
          & .\tests\PowerProfileEnergy.Tests.ps1
          & .\tests\PowerProfileWorkstation.Tests.ps1
          & .\tests\PowerProfileTelemetry.Tests.ps1
          & .\tests\PowerProfileLogViewer.Tests.ps1
          & .\tests\PowerProfileFileIO.Tests.ps1
          & .\tests\PowerProfileGame.Tests.ps1
          python -m unittest discover -s tests -p test_cloud_history.py
