name: PowerShell regression tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and run decision/session tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          # UI suites define callbacks and mock workers; isolate their process state.
          foreach ($suite in @('Insights','Workspace','Distribution','Detection','UI','Settings','Energy','UsageLogs','DeviceHub','Workstation','Telemetry','LogViewer','FileIO','Game','Display','DisplayUI')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tests\PowerProfile$suite.Tests.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Failed suite: $suite" }
          }
          python -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Build clean distribution package
        shell: powershell
        run: .\Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PowerProfile-windows
          path: dist/*
